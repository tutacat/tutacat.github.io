<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width">
</head>
<body>
  <div style="font-size: 2.5em;">
    <code autoselect="" contenteditable="" id="link" href="javascript:void;">{{text_placeholder}}
    </code>
    <br>
    <button id="btn">Copy to clipboard</button>
  </div>
  <em>To use this page, just put the text you want to display/copy as the "hash" part of the url, i.e. /#my%20text</em>
  <script>
    function copyText() {
        navigator.clipboard.writeText(text)
      };
    
    function update() {
      text = location.hash.substr(1);
      link.textContent = ""+text;
    }
    
    btn.onclick = link.onclick = () => { update(); copyText(); }
    update();
  </script>
</body>
</html>
