<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width">
</head>
<body>
  <div style="font-size: 6em;">
    <code>
      <a id="link" href="#" style="user-select: all;">{{text_placeholder}}</a>
    </code>
    <br>
    <button id="btn">Copy to clipboard</button>
  </div>
  <em>To use this page, just put the text you want to display/copy as the "hash" part of the url, i.e. /#my%20text</em>
  <script>
    text = location.hash.substr(1);
    link.textContent = ""+text;
    copyText() {
      navigator.clipboard.writeText(text)
    };
    btn.onclick = link.onclick = copyText;
    btn.select();
  </script>
</body>
</html>
